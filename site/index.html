<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Placa NFC | Agrega Empresa</title>
  <meta name="description" content="Placa de avaliação do Google com aproximação e QR Code. Seu cliente avalia na hora.">
  <style>
    :root { --bg:#0f1115; --card:#181b22; --text:#f3f4f6; --muted:#a1a7b3; --accent:#25d366; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
    main { max-width:560px; width:100%; background:var(--card); border-radius:20px; padding:40px 28px; text-align:center; }
    h1 { font-size:clamp(1.8rem,5vw,2.4rem); line-height:1.15; margin-bottom:14px; }
    p { color:var(--muted); font-size:1.05rem; line-height:1.55; margin-bottom:12px; }
    .stars { color:#fbbf24; font-size:1.6rem; letter-spacing:4px; margin-bottom:18px; }
    a.btn { display:inline-block; margin-top:18px; background:var(--accent); color:#06280f; font-weight:700; text-decoration:none; padding:16px 28px; border-radius:999px; font-size:1.05rem; }
  </style>
</head>
<body>
  <main>
    <div class="stars">★★★★★</div>
    <h1>Placa NFC da Agrega Empresa</h1>
    <p>O cliente aproxima o celular ou lê o QR Code e avalia sua empresa no Google na hora.</p>
    <p>Mais avaliações, mais confiança, mais clientes.</p>
    <a class="btn" href="https://wa.me/556992864960">Chamar no WhatsApp</a>
